{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check Your Email — iSaral</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<style>
:root{--ink:#0C1A2E;--ink-4:#6B84A0;--blue:#1A56DB;--teal:#06B6D4;--emerald:#10B981;--bg:#F3F7FC;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{max-width:420px;text-align:center;padding:48px 36px;background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(12,26,46,.09);}
.icon{width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,.1);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:28px;color:var(--emerald);}
.card h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;color:var(--ink);margin-bottom:10px;}
.card p{font-size:14px;color:var(--ink-4);line-height:1.6;margin-bottom:22px;}
.card a{color:var(--blue);font-weight:700;text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><i class="bi bi-envelope-check"></i></div>
  <h1>Check your email</h1>
  <p>If an account exists with that email, we've sent password reset instructions to it. The link will expire shortly, so use it soon.</p>
  <a href="{% url 'accounts:login' %}">← Back to login</a>
</div>
</body>
</html>
